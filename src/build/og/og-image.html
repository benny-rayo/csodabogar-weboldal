<!doctype html>
<!-- OG-kép forrás (1200x630). Renderelés: python3 _build/og/render.py -->
<html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../public/assets/css/site.css">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{position:relative;width:1200px;height:630px;display:grid;place-content:center;justify-items:center;gap:26px}
.og .lock{width:780px}
.og p{margin:0;font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.2;color:var(--navy);text-align:center;max-width:760px;text-wrap:balance}
.og .k1{position:absolute;left:46px;bottom:28px;width:140px}
.og .k2{position:absolute;right:60px;top:40px;width:230px}
.og .paw{position:absolute;width:56px}
</style></head>
<body><div class="og grid-paper">
<img class="lock" src="../../../public/assets/svg/logo-lockup.svg" alt="">
<p>Fejlesztés, szorongásoldás, iskolaelőkészítés 5-16 éves gyerekeknek</p>
<img class="k1" src="../../../public/assets/svg/kabala-integeto.svg" alt="">
<img class="k2" src="../../../public/assets/svg/kabala-repulo.svg" alt="">
<img class="paw" src="../../../public/assets/svg/mancs-piros.svg" alt="" style="right:120px;bottom:70px;rotate:14deg">
<img class="paw" src="../../../public/assets/svg/mancs-zold.svg" alt="" style="right:200px;bottom:30px;rotate:-10deg;width:44px">
<img class="paw" src="../../../public/assets/svg/mancs-sarga.svg" alt="" style="left:90px;top:60px;rotate:-20deg;width:46px">
</div></body></html>
