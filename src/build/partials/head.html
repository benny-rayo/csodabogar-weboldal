<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#FAF4E8">
<meta name="color-scheme" content="light">
<!-- Open Graph (élesítéskor az og:image és og:url abszolút URL legyen) -->
<meta property="og:type" content="{{og_type|website}}">
<meta property="og:locale" content="hu_HU">
<meta property="og:site_name" content="Csodabogár Fejlesztő Műhely, Tata">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Csodabogár Fejlesztő Műhely, Tata">
<meta name="twitter:card" content="summary_large_image">
<!-- Favicon -->
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="icon" href="assets/svg/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<!-- A két fő font (latin szelet) előtöltése; a latin-ext szelet (ő, ű) unicode-range alapján jön -->
<link rel="preload" href="assets/fonts/baloo-2-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
<script>document.documentElement.classList.add('js')</script>
<script src="assets/js/site.js" defer></script>
